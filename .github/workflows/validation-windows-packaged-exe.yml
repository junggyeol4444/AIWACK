name: AIWACK packaged Windows EXE owner and company persistence (main)
on:
  push:
    branches: [main]
    paths:
      - 'windows-integrated-src/**'
      - 'validation/windows_built_exe_gui.py'
      - 'validation/windows_company_gui.py'
      - '.github/workflows/validation-windows-packaged-exe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows-integrated-src/**'
      - 'validation/**'
      - '.github/workflows/validation-windows-packaged-exe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaged-exe-real-gui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm actual tested native Windows application source on main
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src'
          if (!(Test-Path (Join-Path $src 'desktop/entry.py'))) { throw 'Main integrated app entrypoint missing' }
          if (!(Test-Path (Join-Path $src 'desktop/company_office_gui.py'))) { throw 'Main integrated company office missing' }
          if (!(Test-Path (Join-Path $src 'VERIFIED_SOURCE_MANIFEST.json'))) { throw 'Verified Windows application source manifest missing' }
          python -m compileall -q (Join-Path $src 'desktop')
          if ($LASTEXITCODE -ne 0) { throw 'Integrated Windows app Python compile failure' }
      - name: Install native Windows EXE and screen automation tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller pyautogui pygetwindow pyperclip pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual GUI application exe
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src'
          Set-Location $src
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIWACK --paths . --hidden-import desktop.company_operations --hidden-import desktop.company_office_gui --hidden-import desktop.company_bank_reconciliation --hidden-import desktop.company_campaign_evidence --hidden-import desktop.company_campaign_final_report --hidden-import desktop.company_financial_close --hidden-import desktop.company_model_connect_ui --hidden-import desktop.company_campaign --hidden-import desktop.company_deliverables --hidden-import desktop.company_backup --hidden-import desktop.company_handoffs --hidden-import desktop.company_autopilot --hidden-import desktop.company_continuity --hidden-import desktop.company_staff_metrics --hidden-import desktop.company_department_collaboration --hidden-import desktop.company_department_progress --hidden-import desktop.company_chief_review_leases --hidden-import desktop.company_collaboration_coverage --hidden-import desktop.company_approved_tool_execution --hidden-import desktop.company_native_diagnostics --hidden-import desktop.company_meeting_ai --hidden-import desktop.company_campaign_resume_gate --hidden-import desktop.company_campaign_plan_provenance --hidden-import desktop.company_campaign_owner_dossier --hidden-import desktop.company_campaign_chain_integrity --hidden-import desktop.company_owner_operational_summary --hidden-import desktop.company_wide_campaign --hidden-import desktop.company_product_documents --hidden-import desktop.company_customer_cases --hidden-import desktop.company_failure_followups --hidden-import desktop.company_payment_reconciliation --hidden-import desktop.company_staff_reallocation --hidden-import desktop.company_business_ideas_model --hidden-import desktop.company_business_idea_pipeline --hidden-import desktop.company_business_idea_delivery --add-data 'docs/roadmap_100.csv;docs' desktop/entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch EXE click type save close restart read logout
        shell: pwsh
        env:
          AIWACK_PACKAGED_GUI_ARTIFACTS: ${{ runner.temp }}/packaged-e2e
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src/dist/AIWACK.exe'
          python validation/windows_built_exe_gui.py $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actually click company settings and goal through built EXE; close and reopen
        shell: pwsh
        env:
          AIWACK_PACKAGED_GUI_ARTIFACTS: ${{ runner.temp }}/packaged-company-e2e
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src/dist/AIWACK.exe'
          python validation/windows_company_gui.py $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save company-form GUI screenshots and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiwack-real-company-exe-${{ matrix.os }}
          path: ${{ runner.temp }}/packaged-company-e2e/
          if-no-files-found: warn
      - name: Save GUI screenshots and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiwack-real-packaged-exe-${{ matrix.os }}
          path: ${{ runner.temp }}/packaged-e2e/
          if-no-files-found: warn
