name: AIWACK main native EXE real GGUF approved two-task queue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validation-windows-real-gguf-queue.yml'
      - 'validation/windows_packaged_real_gguf_queue_e2e.py'
      - 'validation/windows_built_exe_gui.py'
      - 'windows-integrated-src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-gguf-approved-company-queue-exe:
    name: Real GGUF approved two-task chief-worker queue (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preserved executable Windows company source on main
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src'
          foreach ($part in @('desktop/entry.py','desktop/company_office_gui.py','desktop/company_model_connect_ui.py','VERIFIED_SOURCE_MANIFEST.json')) {
            if (!(Test-Path (Join-Path $src $part))) { throw "Main integrated source missing: $part" }
          }
          python -m compileall -q (Join-Path $src 'desktop')
          if ($LASTEXITCODE -ne 0) { throw 'Main native company source failed Python compile' }
      - name: Install actual EXE builder and Windows mouse keyboard drivers
        shell: pwsh
        run: |
          python -m pip install pyinstaller pyautogui pygetwindow pyperclip pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native packaged Windows AIWACK.exe
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src')
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIWACK --paths . --hidden-import desktop.company_operations --hidden-import desktop.company_office_gui --hidden-import desktop.company_model_connect_ui --add-data 'docs/roadmap_100.csv;docs' desktop/entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/AIWACK.exe')) { throw 'Actual packaged EXE missing' }
      - name: Download VERIFIED Windows llama.cpp CPU runner and a REAL small GGUF
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'real-gguf-files'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $dir 'llama-b11433-bin-win-cpu-x64.zip'
          Invoke-WebRequest -Uri 'https://github.com/ggml-org/llama.cpp/releases/download/b11433/llama-b11433-bin-win-cpu-x64.zip' -OutFile $zip -MaximumRedirection 10
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '301943380e45deae3991d42dddd03fae65c6a4963a5d882328a60208b43aa9e0') { throw 'llama.cpp official release SHA256 differs' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $dir 'cpu')
          $engine = Get-ChildItem (Join-Path $dir 'cpu') -Recurse -File -Filter 'llama-completion.exe' | Select-Object -First 1
          if (-not $engine) { throw 'Verified official archive has no llama-completion.exe' }
          $gguf = Join-Path $dir 'SmolLM2-135M-Instruct-Q4_K_M.gguf'
          Invoke-WebRequest -Uri 'https://huggingface.co/lmstudio-community/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf?download=true' -OutFile $gguf -MaximumRedirection 10
          if ((Get-Item $gguf).Length -lt 80000000 -or (Get-Item $gguf).Length -gt 120000000) { throw 'GGUF size invalid; do not use an HTML error page' }
          # SHA256 published on the verified model artifact's Hugging Face file page.
          if ((Get-FileHash $gguf -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bda484992f9655d22504b14e57985257fa6a86937c61f957cf99c10a3bcae169') { throw 'Real GGUF source checksum mismatch' }
          $stream = [System.IO.File]::OpenRead($gguf)
          try {
            $magic = [byte[]]::new(4)
            [void]$stream.Read($magic,0,4)
            if ([System.Text.Encoding]::ASCII.GetString($magic) -ne 'GGUF') { throw 'Downloaded model lacks GGUF magic' }
          } finally { $stream.Dispose() }
          Write-Host "Verified public llama.cpp SHA256 and genuine GGUF magic"
          Write-Host "Model SHA256: $((Get-FileHash $gguf -Algorithm SHA256).Hash)"
          "AIWACK_REAL_LLAMA_CLI=$($engine.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AIWACK_REAL_GGUF_FILE=$gguf" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: PHYSICALLY click packaged AIWACK.exe real GGUF two-task queue and reopen
        shell: pwsh
        env:
          AIWACK_REAL_GGUF_QUEUE_EVIDENCE: ${{ runner.temp }}/aiwack-real-gguf-queue-evidence
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src/dist/AIWACK.exe'
          python validation/windows_packaged_real_gguf_queue_e2e.py $exe $env:AIWACK_REAL_LLAMA_CLI $env:AIWACK_REAL_GGUF_FILE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save real EXE screen captures and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiwack-real-gguf-queue-windows-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/aiwack-real-gguf-queue-evidence/
          if-no-files-found: warn
          retention-days: 14
