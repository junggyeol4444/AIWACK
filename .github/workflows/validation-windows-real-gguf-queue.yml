name: AIWACK main native EXE real GGUF approved two-task queue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validation-windows-real-gguf-queue.yml'
      - 'validation/windows_packaged_real_gguf_queue_e2e.py'
      - 'validation/windows_real_parallel_company_e2e.py'
      - 'validation/real_gguf_preflight.py'
      - 'validation/windows_built_exe_gui.py'
      - 'windows-integrated-src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-gguf-approved-company-queue-exe:
    name: Real GGUF approved two-task chief-worker queue (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preserved executable Windows company source on main
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src'
          foreach ($part in @('desktop/entry.py','desktop/company_office_gui.py','desktop/company_model_connect_ui.py','VERIFIED_SOURCE_MANIFEST.json')) {
            if (!(Test-Path (Join-Path $src $part))) { throw "Main integrated source missing: $part" }
          }
          python -m compileall -q (Join-Path $src 'desktop')
          if ($LASTEXITCODE -ne 0) { throw 'Main native company source failed Python compile' }
      - name: Install actual EXE builder and Windows mouse keyboard drivers
        shell: pwsh
        run: |
          python -m pip install pyinstaller pyautogui pygetwindow pyperclip pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native packaged Windows AIWACK.exe
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src')
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIWACK --paths . --hidden-import desktop.company_operations --hidden-import desktop.company_office_gui --hidden-import desktop.company_model_connect_ui --hidden-import desktop.company_campaign --hidden-import desktop.company_deliverables --hidden-import desktop.company_backup --hidden-import desktop.company_handoffs --hidden-import desktop.company_autopilot --hidden-import desktop.company_staff_metrics --hidden-import desktop.company_department_collaboration --hidden-import desktop.company_department_progress --hidden-import desktop.company_chief_review_leases --hidden-import desktop.company_collaboration_coverage --hidden-import desktop.company_approved_tool_execution --hidden-import desktop.company_native_diagnostics --hidden-import desktop.company_meeting_ai --add-data 'docs/roadmap_100.csv;docs' desktop/entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/AIWACK.exe')) { throw 'Actual packaged EXE missing' }
      - name: Download VERIFIED Windows llama.cpp CPU runner and a REAL small GGUF
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'real-gguf-files'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $dir 'llama-b11433-bin-win-cpu-x64.zip'
          Invoke-WebRequest -Uri 'https://github.com/ggml-org/llama.cpp/releases/download/b11433/llama-b11433-bin-win-cpu-x64.zip' -OutFile $zip -MaximumRedirection 10
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '301943380e45deae3991d42dddd03fae65c6a4963a5d882328a60208b43aa9e0') { throw 'llama.cpp official release SHA256 differs' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $dir 'cpu')
          $engine = Get-ChildItem (Join-Path $dir 'cpu') -Recurse -File -Filter 'llama-completion.exe' | Select-Object -First 1
          if (-not $engine) { throw 'Verified official archive has no llama-completion.exe' }
          $gguf = Join-Path $dir 'SmolLM2-135M-Instruct-Q4_K_M.gguf'
          Invoke-WebRequest -Uri 'https://huggingface.co/lmstudio-community/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf?download=true' -OutFile $gguf -MaximumRedirection 10
          if ((Get-Item $gguf).Length -lt 80000000 -or (Get-Item $gguf).Length -gt 120000000) { throw 'GGUF size invalid; do not use an HTML error page' }
          # SHA256 published on the verified model artifact's Hugging Face file page.
          if ((Get-FileHash $gguf -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bda484992f9655d22504b14e57985257fa6a86937c61f957cf99c10a3bcae169') { throw 'Real GGUF source checksum mismatch' }
          $stream = [System.IO.File]::OpenRead($gguf)
          try {
            $magic = [byte[]]::new(4)
            [void]$stream.Read($magic,0,4)
            if ([System.Text.Encoding]::ASCII.GetString($magic) -ne 'GGUF') { throw 'Downloaded model lacks GGUF magic' }
          } finally { $stream.Dispose() }
          Write-Host "Verified public llama.cpp SHA256 and genuine GGUF magic"
          Write-Host "Model SHA256: $((Get-FileHash $gguf -Algorithm SHA256).Hash)"
          "AIWACK_REAL_LLAMA_CLI=$($engine.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AIWACK_REAL_GGUF_FILE=$gguf" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Diagnose both official real-GGUF CPU runners; require a clean inference
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'aiwack-llama-preflight.txt'
          $chosen = Join-Path $env:RUNNER_TEMP 'aiwack-llama-verified-cli.txt'
          python validation/real_gguf_preflight.py $env:AIWACK_REAL_LLAMA_CLI $env:AIWACK_REAL_GGUF_FILE $probe $chosen
          $originalOk = $LASTEXITCODE -eq 0
          if (-not $originalOk) {
            # The official b11433 Windows CPU executables can exit with
            # STATUS_HEAP_CORRUPTION. Record that FAIL; test a different
            # OFFICIAL SHA256-pinned release instead of treating stdout as PASS.
            $dir = Join-Path $env:RUNNER_TEMP 'real-gguf-files'
            $zip = Join-Path $dir 'llama-b11748-bin-win-cpu-x64.zip'
            Invoke-WebRequest -Uri 'https://github.com/ggml-org/llama.cpp/releases/download/b11748/llama-b11748-bin-win-cpu-x64.zip' -OutFile $zip -MaximumRedirection 10
            $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -ne '59083a1df768be176d851ddbab6bbde2d8a67a1ea7f1d42f770753d13dc74f60') {
              throw 'Official newer llama.cpp release SHA256 mismatch; no executable will run'
            }
            $extract = Join-Path $dir 'cpu-b11748'
            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
            $primary = Get-ChildItem -LiteralPath $extract -File -Recurse -Filter 'llama-completion.exe' | Select-Object -First 1
            if (-not $primary) { throw 'Official SHA256-verified newer CPU release has no llama-completion.exe' }
            $recentProbe = Join-Path $env:RUNNER_TEMP 'aiwack-llama-preflight-b11748.txt'
            python validation/real_gguf_preflight.py $primary.FullName $env:AIWACK_REAL_GGUF_FILE $recentProbe $chosen
            if ($LASTEXITCODE -ne 0) {
              throw 'Both independently SHA256-verified official GGUF CPU releases failed genuine inference'
            }
          }
          $selected = (Get-Content -LiteralPath $chosen -Raw).Trim()
          if (-not (Test-Path -LiteralPath $selected)) { throw 'Selected verified GGUF runner is missing' }
          "AIWACK_REAL_LLAMA_CLI=$selected" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Real GGUF runner verified by model inference: $([System.IO.Path]::GetFileName($selected))"
      - name: PHYSICALLY click packaged AIWACK.exe real GGUF two-task queue and reopen
        shell: pwsh
        env:
          AIWACK_REAL_GGUF_QUEUE_EVIDENCE: ${{ runner.temp }}/aiwack-real-gguf-queue-evidence
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src/dist/AIWACK.exe'
          python validation/windows_packaged_real_gguf_queue_e2e.py $exe $env:AIWACK_REAL_LLAMA_CLI $env:AIWACK_REAL_GGUF_FILE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real GGUF dual-worker concurrent execution, chief review and SQLite restart
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'aiwack-native-parallel-evidence'
          python validation/windows_real_parallel_company_e2e.py $env:AIWACK_REAL_LLAMA_CLI $env:AIWACK_REAL_GGUF_FILE $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Real concurrent GGUF workers/chief/persistence validation failed' }
      - name: Save real EXE screen captures and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiwack-real-gguf-queue-windows-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/aiwack-real-gguf-queue-evidence/
            ${{ runner.temp }}/aiwack-native-parallel-evidence/
            ${{ runner.temp }}/aiwack-llama-preflight.txt
            ${{ runner.temp }}/aiwack-llama-preflight-b11748.txt
          if-no-files-found: warn
          retention-days: 14
