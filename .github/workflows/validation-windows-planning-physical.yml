name: AIWACK packaged EXE fresh physical planning acceptance (validation)
on:
  push:
    branches:
      - validation/windows-user-e2e-20261015
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaged-exe-real-gui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and extract immutable source archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'source-archives/AIWACK_Stage100_Robots_Compliant_Crawling_Plugin_Market_Integration_Source.zip'
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne 'f855f9ed9afada6a75f80011bf86f95cda053045d54e4445fbf399531626b020') { throw 'Source archive changed' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'aiwack-built-exe')
          python validation/patch_source.py (Join-Path $env:RUNNER_TEMP 'aiwack-built-exe/AIWACK-Stage54')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation/app_navigation_patch.py (Join-Path $env:RUNNER_TEMP 'aiwack-built-exe/AIWACK-Stage54')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation/install_company_office.py (Join-Path $env:RUNNER_TEMP 'aiwack-built-exe/AIWACK-Stage54')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install native Windows EXE and screen automation tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller pyautogui pygetwindow pyperclip pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual GUI application exe
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-built-exe/AIWACK-Stage54')
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIWACK --paths . --hidden-import desktop.company_operations --hidden-import desktop.company_office_gui --hidden-import desktop.company_bank_reconciliation --hidden-import desktop.company_campaign_evidence --hidden-import desktop.company_campaign_final_report --hidden-import desktop.company_financial_close --hidden-import desktop.company_model_connect_ui --add-data 'docs/roadmap_100.csv;docs' desktop/entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Physically click fresh packaged Windows EXE goal scan owner-approve and reopen
        shell: pwsh
        env:
          AIWACK_PLANNING_GUI_EVIDENCE: ${{ runner.temp }}/aiwack-planning-real-gui
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'aiwack-built-exe/AIWACK-Stage54/dist/AIWACK.exe'
          python validation/windows_planning_physical_e2e.py $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload real Windows EXE planning GUI screens and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiwack-physical-planning-${{ matrix.os }}
          path: ${{ runner.temp }}/aiwack-planning-real-gui/
          if-no-files-found: warn
          retention-days: 30
