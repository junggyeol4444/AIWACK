name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Code / storage tests
        run: python -m pytest -q
      - name: Install existing Windows native integrated source for regression tests
        run: python -m pip install -e './windows-integrated-src[dev]'
      - name: Native company recovery, approved queue, GUI-state and parallel execution regressions
        run: |
          cd windows-integrated-src
          python -m pytest -q tests/test_company_staff_metrics.py tests/test_company_autopilot.py tests/test_company_continuity.py tests/test_company_handoffs.py tests/test_company_backup.py tests/test_company_deliverables.py tests/test_company_campaign.py tests/test_windows_real_parallel_validation.py tests/test_concurrent_scheduler_and_queue.py tests/test_recurring_scheduler.py tests/test_task_queue.py tests/test_queue_recovery.py tests/test_company_parallel_approved_cycle.py tests/test_company_approved_autocycle.py tests/test_company_chief_review.py tests/test_local_models.py tests/test_company_operations_center.py tests/test_company_model_onboarding.py tests/test_task_execution.py tests/test_task_parallel.py tests/test_company_department_collaboration.py tests/test_company_department_progress.py tests/test_company_chief_review_leases.py tests/test_company_approved_tool_execution.py tests/test_company_native_diagnostics.py tests/test_company_meeting_ai.py tests/test_company_failure_followups.py tests/test_company_payment_reconciliation.py tests/test_company_staff_reallocation.py tests/test_company_wide_campaign.py tests/test_genuine_chief_plan_parser_round22.py tests/test_packaged_hwnd_guard_round22.py tests/test_employee_access.py tests/test_round8_real_gguf_resume_audit.py tests/test_round10_integrity_and_binary_binding.py tests/test_round11_plan_seals_and_resume.py tests/test_round12_genuine_audit_and_fail_closed.py tests/test_round13_genuine_plan_and_audit.py tests/test_round14_strict_genuine_plan.py tests/test_round15_durable_chief_groups.py tests/test_round16_real_campaign_provenance_and_native_pid.py tests/test_round17_chief_plan_chain_and_resume.py tests/test_round18_bank_and_campaign_evidence.py tests/test_round19_financial_close_and_campaign_inspect.py tests/test_round20_incremental_financial_close.py tests/test_round21_campaign_final_report.py tests/test_packaged_gui_modal_safety.py
      - name: Verify cumulative original source, owner approval, resume and local recovery contracts
        run: |
          cd windows-integrated-src
          python -m pytest -q tests/test_round_0536_dossier_recovery_inventory.py tests/test_round_20261023_resume_contract.py tests/test_round_20261023_chief_owner_chain_contract.py
      - name: Verify approved final dossier crash inventory and 30-step completion gate
        run: |
          cd windows-integrated-src
          python -m pytest -q tests/test_owner_dossier_crash_inventory_bounds_20261025.py tests/test_campaign_completed_gate_and_run_next_20261025.py tests/test_campaign_future_step_resume_integrity_20261025.py tests/test_campaign_chain_receipt_revalidation_20261025.py tests/test_campaign_default_provenance_and_chain_binding_20261025.py tests/test_campaign_final_model_attempt_audit_20261025.py tests/test_campaign_final_report_retry_provenance_20261025.py tests/test_final_report_cross_restart_budget_20261025.py tests/test_final_model_attempt_chain_native_20261025.py tests/test_native_owner_real_gguf_one_step_ui_20261025.py tests/test_campaign_exact_integer_provenance_20261025.py tests/test_partial_genuine_chief_resume_20261025.py tests/test_campaign_progress_and_report_binding_20261025.py tests/test_campaign_evidence_disk_inventory_20261025.py tests/test_company_full_disk_audit_20261025.py
      - name: Verify Windows HWND recovery guards without claiming physical clicks
        run: python -m pytest -q validation/test_windows_native_window_handles.py validation/test_packaged_process_owner_binding.py
      - name: Real-model chief plan rejection audit regressions (metadata only)
        run: python -m pytest -q validation/test_chief_plan_failure_audit_round23.py
      - name: Verify nested historical ZIP and cross-archive source preservation
        run: python -m pytest -q validation/test_audit_nested_original_source_archive.py
      - name: Native app data self-test
        run: python -m desktop.entry --self-test
      - name: Start and click actual GUI under Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          xvfb-run -a python -m scripts.desktop_gui_smoke
          (cd windows-integrated-src && xvfb-run -a python -m scripts.company_real_meeting_ai_gui_smoke)
          (cd windows-integrated-src && xvfb-run -a python -m scripts.company_business_evidence_gui_smoke)
          (cd windows-integrated-src && xvfb-run -a python -m scripts.company_wide_campaign_gui_smoke)
          (cd windows-integrated-src && xvfb-run -a python -m scripts.company_continuity_gui_smoke)
      - name: Legacy API integration (developer compatibility)
        run: python scripts/real_smoke_test.py
      - name: Verify roadmap progression
        run: python scripts/next_step.py
