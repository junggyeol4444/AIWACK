name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Code / storage tests
        run: python -m pytest -q
      - name: Native app data self-test
        run: python -m desktop.entry --self-test
      - name: Start and click actual GUI under Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          xvfb-run -a python -m scripts.desktop_gui_smoke
      - name: Legacy API integration (developer compatibility)
        run: python scripts/real_smoke_test.py
      - name: Verify roadmap progression
        run: python scripts/next_step.py
