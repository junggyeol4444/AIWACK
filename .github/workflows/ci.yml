name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Code / storage tests
        run: python -m pytest -q
      - name: Install existing Windows native integrated source for regression tests
        run: python -m pip install -e './windows-integrated-src[dev]'
      - name: Native company recovery, approved queue, GUI-state and parallel execution regressions
        run: |
          cd windows-integrated-src
          python -m pytest -q tests/test_company_staff_metrics.py tests/test_company_autopilot.py tests/test_company_continuity.py tests/test_company_handoffs.py tests/test_company_backup.py tests/test_company_deliverables.py tests/test_company_campaign.py tests/test_windows_real_parallel_validation.py tests/test_concurrent_scheduler_and_queue.py tests/test_recurring_scheduler.py tests/test_task_queue.py tests/test_queue_recovery.py tests/test_company_parallel_approved_cycle.py tests/test_company_approved_autocycle.py tests/test_company_chief_review.py tests/test_local_models.py tests/test_company_operations_center.py tests/test_company_model_onboarding.py tests/test_task_execution.py tests/test_task_parallel.py tests/test_company_department_collaboration.py tests/test_company_department_progress.py tests/test_company_chief_review_leases.py tests/test_company_approved_tool_execution.py tests/test_company_native_diagnostics.py tests/test_company_meeting_ai.py tests/test_company_failure_followups.py tests/test_company_payment_reconciliation.py tests/test_company_staff_reallocation.py tests/test_company_wide_campaign.py tests/test_genuine_chief_plan_parser_round22.py tests/test_employee_access.py
      - name: Native app data self-test
        run: python -m desktop.entry --self-test
      - name: Start and click actual GUI under Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          xvfb-run -a python -m scripts.desktop_gui_smoke
          (cd windows-integrated-src && xvfb-run -a python -m scripts.company_real_meeting_ai_gui_smoke)
          (cd windows-integrated-src && xvfb-run -a python -m scripts.company_business_evidence_gui_smoke)
          (cd windows-integrated-src && xvfb-run -a python -m scripts.company_wide_campaign_gui_smoke)
          (cd windows-integrated-src && xvfb-run -a python -m scripts.company_continuity_gui_smoke)
      - name: Legacy API integration (developer compatibility)
        run: python scripts/real_smoke_test.py
      - name: Verify roadmap progression
        run: python scripts/next_step.py
