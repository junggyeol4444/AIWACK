name: Export cumulative Windows native AIWACK source from main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-verified-windows-source.yml'
      - 'windows-integrated-src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiwack-current-full-source
  cancel-in-progress: false

jobs:
  archive-current-source:
    name: Archive every current tracked Windows native source file
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify cumulative main source is complete and compiles
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src'
          $required = @(
            'VERIFIED_SOURCE_MANIFEST.json',
            'desktop/entry.py',
            'desktop/company_office_gui.py',
            'desktop/company_operations.py',
            'desktop/storage.py',
            'desktop/company_approved_tool_execution.py',
            'desktop/company_chief_review_leases.py',
            'desktop/company_collaboration_coverage.py',
            'desktop/company_staff_metrics.py',
            'desktop/company_native_diagnostics.py',
            'tests/test_company_approved_tool_execution.py',
            'tests/test_company_chief_review_leases.py'
          )
          foreach ($relative in $required) {
            if (!(Test-Path -LiteralPath (Join-Path $src $relative))) {
              throw "Missing cumulative original/native source file: $relative"
            }
          }
          $paths = @(git ls-tree -r --name-only HEAD -- windows-integrated-src)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate main-tracked source' }
          if ($paths.Count -lt 879) {
            throw "Native source unexpectedly shrank: $($paths.Count) tracked files"
          }
          if ($paths -match 'dev_company\.sqlite3$') {
            throw 'Development SQLite database must not be distributed with source'
          }
          python -m compileall -q (Join-Path $src 'desktop')
          if ($LASTEXITCODE -ne 0) { throw 'Current native desktop Python source does not compile' }
          New-Item -ItemType Directory -Force 'artifacts' | Out-Null
          $paths | Out-File 'artifacts/AIWACK_MAIN_누적_소스파일목록.txt' -Encoding utf8
          Write-Host "Current, not historical, main native source files: $($paths.Count)"

      - name: Export latest cumulative tracked application source as a complete ZIP
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'artifacts/AIWACK_MAIN_누적_전체소스.zip'
          git archive --format=zip "--output=$archive" HEAD windows-integrated-src
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $archive)) {
            throw 'Cannot archive current main source'
          }
          $paths = @(git ls-tree -r --name-only HEAD -- windows-integrated-src)
          python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); f=[v.filename for v in z.infolist() if not v.is_dir()]; print('Native source ZIP verified:',len(f)); assert len(f)==int(sys.argv[2])" "$archive" "$($paths.Count)"
          if ($LASTEXITCODE -ne 0) { throw 'ZIP entries do not match the tracked source inventory' }

      - name: Publish complete source ZIP and inventory
        uses: actions/upload-artifact@v4
        with:
          name: AIWACK_MAIN_cumulative_native_source
          path: |
            artifacts/AIWACK_MAIN_누적_전체소스.zip
            artifacts/AIWACK_MAIN_누적_소스파일목록.txt
          if-no-files-found: error
          retention-days: 30
