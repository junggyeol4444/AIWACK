name: AIWACK Windows AI Company Real UI (test branch only)
on:
  push:
    branches: [validation/windows-user-e2e-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company-office-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract immutable source, apply only test branch fixes and live office
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'source-archives/AIWACK_Stage100_Robots_Compliant_Crawling_Plugin_Market_Integration_Source.zip'
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne 'f855f9ed9afada6a75f80011bf86f95cda053045d54e4445fbf399531626b020') { throw 'Immutable main snapshot mismatched' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'aiwack-office-src')
          $src = Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54'
          python validation/patch_source.py $src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation/app_navigation_patch.py $src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation/install_company_office.py $src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q (Join-Path $src 'desktop')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install actual Windows executable and UI test tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller pyautogui pygetwindow pyperclip pillow pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run company operations and planning tests on Windows
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54')
          $env:PYTHONPATH = (Get-Location).Path
          python -m pytest -q tests/test_company_operations_center.py tests/test_company_planning_cockpit.py tests/test_company_model_onboarding.py tests/test_company_chief_handoff.py tests/test_company_chief_review.py --maxfail=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Drive owner planning screen with real Windows mouse input
        shell: pwsh
        env:
          AIWACK_PLANNING_SCREENSHOT: ${{ runner.temp }}/aiwack-office-screenshots/planning-approval-physical-click.png
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54')
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'aiwack-office-screenshots') | Out-Null
          $env:PYTHONPATH = (Get-Location).Path
          python scripts/company_planning_gui_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actually click local model registration wizard on Windows desktop
        shell: pwsh
        env:
          AIWACK_MODEL_WIZARD_SCREENSHOT: ${{ runner.temp }}/aiwack-office-screenshots/model-connector-native-gui.png
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54')
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'aiwack-office-screenshots') | Out-Null
          $env:PYTHONPATH = (Get-Location).Path
          python scripts/company_model_setup_gui_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actually click owner-approved result into completed task on Windows
        shell: pwsh
        env:
          AIWACK_OWNER_COMPLETE_SCREENSHOT: ${{ runner.temp }}/aiwack-office-screenshots/owner-approved-completion-click.png
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54')
          $env:PYTHONPATH = (Get-Location).Path
          python scripts/company_owner_completion_gui_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Physically reject and approve chief-to-staff task order without execution
        shell: pwsh
        env:
          AIWACK_CHIEF_HANDOFF_SCREENSHOT: ${{ runner.temp }}/aiwack-office-screenshots/chief-staff-owner-approved.png
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54')
          $env:PYTHONPATH = (Get-Location).Path
          python scripts/company_chief_order_gui_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Physically open saved chief report and accept on owner desktop UI
        shell: pwsh
        env:
          AIWACK_CHIEF_REVIEW_SCREENSHOT: ${{ runner.temp }}/aiwack-office-screenshots/chief-review-owner-accept-physical.png
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54')
          $env:PYTHONPATH = (Get-Location).Path
          python scripts/company_chief_review_gui_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build packaged Windows AIWACK.exe (actual company application)
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54')
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIWACK --paths . --hidden-import desktop.company_operations --hidden-import desktop.company_office_gui --hidden-import desktop.company_bank_reconciliation --hidden-import desktop.company_campaign_evidence --hidden-import desktop.company_campaign_final_report --hidden-import desktop.company_financial_close --hidden-import desktop.company_business_ideas_model --hidden-import desktop.company_business_idea_pipeline --add-data 'docs/roadmap_100.csv;docs' desktop/entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/AIWACK.exe')) { throw 'AIWACK.exe missing' }
      - name: Build Windows-native synthetic model subprocess for adapter integration
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54')
          python -m PyInstaller --noconfirm --clean --onefile --console --name AIWACK-ModelStub (Join-Path $env:GITHUB_WORKSPACE 'validation/windows_fake_llm.py')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/AIWACK-ModelStub.exe')) { throw 'Synthetic Windows-native test binary missing' }
      - name: Test packaged synthetic runner with Korean input under Windows cp1252
        shell: pwsh
        env:
          AIWACK_NATIVE_SYNTHETIC_RUNNER: ${{ runner.temp }}/aiwack-office-src/AIWACK-Stage54/dist/AIWACK-ModelStub.exe
        run: |
          python -m pytest -q validation/test_windows_fake_llm_encoding.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Windows model subprocess cancel timeout and relaunch
        shell: pwsh
        env:
          AIWACK_NATIVE_SYNTHETIC_RUNNER: ${{ runner.temp }}/aiwack-office-src/AIWACK-Stage54/dist/AIWACK-ModelStub.exe
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54')
          $env:PYTHONPATH = (Get-Location).Path
          python -m pytest -q (Join-Path $env:GITHUB_WORKSPACE 'validation/test_windows_fake_llm_lifecycle.py') --maxfail=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regression test for selected company tab detection
        shell: pwsh
        run: |
          python -m pytest -q validation/test_company_tab_locator.py validation/test_task_row_locator.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full black-box packaged AIWACK.exe chief to worker to owner approvals
        shell: pwsh
        env:
          AIWACK_PACKAGED_GUI_ARTIFACTS: ${{ runner.temp }}/aiwack-office-screenshots/packaged-full-company
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54/dist/AIWACK.exe'
          $stub = Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54/dist/AIWACK-ModelStub.exe'
          python validation/windows_packaged_company_full_e2e.py $exe $stub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Physically run chief-to-worker model subprocess via owner GUI
        shell: pwsh
        env:
          AIWACK_NATIVE_SYNTHETIC_RUNNER: ${{ runner.temp }}/aiwack-office-src/AIWACK-Stage54/dist/AIWACK-ModelStub.exe
          AIWACK_CHIEF_LIVE_SCREENSHOT: ${{ runner.temp }}/aiwack-office-screenshots/chief-staff-native-subprocess-live.png
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54')
          $env:PYTHONPATH = (Get-Location).Path
          python scripts/company_chief_live_gui_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate native subprocess staff execution audit and owner review
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54')
          $env:PYTHONPATH = (Get-Location).Path
          $stub = (Resolve-Path 'dist/AIWACK-ModelStub.exe').Path
          python (Join-Path $env:GITHUB_WORKSPACE 'validation/windows_office_model_integration.py') $stub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch real EXE, click office buttons, save, exit and reopen
        shell: pwsh
        env:
          AIWACK_PACKAGED_GUI_ARTIFACTS: ${{ runner.temp }}/aiwack-office-screenshots
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'aiwack-office-src/AIWACK-Stage54/dist/AIWACK.exe'
          python validation/windows_office_e2e.py $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve built AIWACK Windows company EXE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiwack-company-program-${{ matrix.os }}
          path: ${{ runner.temp }}/aiwack-office-src/AIWACK-Stage54/dist/AIWACK.exe
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve real Windows office screenshots and errors
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiwack-live-company-office-${{ matrix.os }}
          path: ${{ runner.temp }}/aiwack-office-screenshots/
          if-no-files-found: warn
