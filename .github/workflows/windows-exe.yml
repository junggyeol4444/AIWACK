name: Windows EXE build and real startup check

on:
  push:
    branches: [main, validation/windows-user-e2e-20261015]
    paths:
      - '.github/workflows/windows-exe.yml'
      - 'validation/**'
      - 'source-archives/**'
      - 'windows-integrated-src/**'
      - 'deployment/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Verified distributable AIWACK.exe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify latest fully integrated, original-preserving main source
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'windows-integrated-src'
          $manifestPath = Join-Path $src 'VERIFIED_SOURCE_MANIFEST.json'
          if (!(Test-Path -LiteralPath $manifestPath)) { throw 'Verified integrated app manifest missing' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne '9eb950adb30da7e694e0b698bbcd2bf849c15c53' -or $manifest.files -ne 851) { throw 'Integrated source baseline manifest unexpectedly changed' }
          foreach ($relative in @('desktop/entry.py','desktop/company_office_gui.py','desktop/company_operations.py','desktop/company_model_connect_ui.py','docs/original_project_spec.txt')) {
            if (!(Test-Path -LiteralPath (Join-Path $src $relative))) { throw "Required app source missing: $relative" }
          }
          python -m compileall -q (Join-Path $src 'desktop')
          if ($LASTEXITCODE -ne 0) { throw 'Integrated source Python compilation failed' }
          $sourceZip = Join-Path $env:RUNNER_TEMP 'AIWACK_Integrated_Source.zip'
          Compress-Archive -LiteralPath $src -DestinationPath $sourceZip -Force
          if (!(Test-Path -LiteralPath $sourceZip)) { throw 'Integrated source ZIP missing' }
          "AIWACK_RELEASE_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AIWACK_RELEASE_SOURCE_ZIP=$sourceZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install native Windows EXE builder and actual GUI drivers
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller pytest pyautogui pygetwindow pyperclip pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual Windows SQLite interruption recovery and owner safeguards
        shell: pwsh
        run: |
          Set-Location $env:AIWACK_RELEASE_SRC
          python -m pytest -q tests/test_company_backup.py tests/test_company_deliverables.py tests/test_company_campaign.py tests/test_windows_real_parallel_validation.py tests/test_concurrent_scheduler_and_queue.py tests/test_recurring_scheduler.py tests/test_task_queue.py tests/test_queue_recovery.py tests/test_company_parallel_approved_cycle.py tests/test_company_chief_review.py tests/test_company_approved_autocycle.py tests/test_local_models.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows T17 recovery and approval regression failed' }
      - name: Verify actual native company GUI controls visible before EXE packaging
        shell: pwsh
        run: |
          cd windows-integrated-src
          python scripts/company_office_gui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Native AIWACK company GUI controls are clipped or non-functional' }
      - name: Build verified native Windows desktop application
        shell: pwsh
        run: |
          Set-Location $env:AIWACK_RELEASE_SRC
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIWACK --paths . --hidden-import desktop.company_operations --hidden-import desktop.company_office_gui --hidden-import desktop.company_model_connect_ui --hidden-import desktop.company_campaign --hidden-import desktop.company_deliverables --hidden-import desktop.company_backup --add-data 'docs/roadmap_100.csv;docs' desktop/entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $env:AIWACK_RELEASE_SRC 'dist/AIWACK.exe'
          if (!(Test-Path $exe)) { throw 'Native release AIWACK.exe missing' }
          "AIWACK_RELEASE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Actual compiled EXE self-test in fresh Windows process
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:AIWACK_RELEASE_EXE -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Native EXE self-test exit code $($process.ExitCode)" }
      - name: Build offline test-only synthetic runner (never ship model stub)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name AIWACK-ModelStub validation/windows_fake_llm.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stub = Join-Path $env:GITHUB_WORKSPACE 'dist/AIWACK-ModelStub.exe'
          if (!(Test-Path $stub)) { throw 'Synthetic test runner missing' }
          "AIWACK_RELEASE_TEST_STUB=$stub" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Physically click packaged company EXE from setup to approval and restart
        shell: pwsh
        env:
          AIWACK_PACKAGED_GUI_ARTIFACTS: ${{ runner.temp }}/aiwack-production-gui-evidence
        run: |
          python validation/windows_packaged_company_full_e2e.py $env:AIWACK_RELEASE_EXE $env:AIWACK_RELEASE_TEST_STUB
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package end-user EXE, verified optional model setup and Korean guide
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'AIWACK_Windows_Ready'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item -LiteralPath $env:AIWACK_RELEASE_EXE -Destination (Join-Path $folder 'AIWACK.exe')
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'deployment/Windows_사용가이드.md') -Destination (Join-Path $folder 'Windows_사용가이드.md')
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'deployment/Setup_Verified_Local_GGUF.ps1') -Destination (Join-Path $folder 'Setup_Verified_Local_GGUF.ps1')
          $checksum = (Get-FileHash (Join-Path $folder 'AIWACK.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          "AIWACK.exe SHA256: $checksum" | Set-Content -LiteralPath (Join-Path $folder 'SHA256.txt') -Encoding utf8
          $release = Join-Path $env:RUNNER_TEMP 'AIWACK_Windows_Ready.zip'
          Compress-Archive -LiteralPath $folder -DestinationPath $release -Force
          if (!(Test-Path $release)) { throw 'Distributable Windows ZIP missing' }
          "AIWACK_RELEASE_ZIP=$release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload ready-to-use Windows EXE distribution
        uses: actions/upload-artifact@v4
        with:
          name: AIWACK_Windows_Ready_${{ matrix.os }}
          path: ${{ env.AIWACK_RELEASE_ZIP }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload fully integrated original-plus-latest source
        uses: actions/upload-artifact@v4
        with:
          name: AIWACK_Integrated_Source_${{ matrix.os }}
          path: ${{ env.AIWACK_RELEASE_SOURCE_ZIP }}
          if-no-files-found: error
          retention-days: 30
      - name: Save actual Windows GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIWACK_Release_GUI_Evidence_${{ matrix.os }}
          path: ${{ runner.temp }}/aiwack-production-gui-evidence/
          if-no-files-found: warn
          retention-days: 30
