name: Hourly AIWACK development
on:
  schedule:
    - cron: '30 * * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: hourly-aiwack-development
  cancel-in-progress: false
jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python -m desktop.entry --self-test
          python scripts/real_smoke_test.py
          python scripts/next_step.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check AI key and existing proposal
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY not configured. Code generation skipped; no AI API costs." >> "$GITHUB_STEP_SUMMARY"
          elif gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName --jq '.[].headRefName' | grep -q '^automation/'; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Existing automation PR awaits review; avoid duplicate edits." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Implement ONE stage with Codex
        if: steps.gate.outputs.enabled == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          allow-bots: true
          prompt-file: docs/AUTOMATION_PROMPT.md
      - name: Verify changes
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python -m pytest -q
          python scripts/real_smoke_test.py
          python scripts/next_step.py
          if git status --porcelain | grep -Eq '(^| )\.github/|(^| )\.env$'; then
            echo "Protected config change detected."
            exit 1
          fi
      - name: Verify integrated native application tests
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python -m pip install -e './windows-integrated-src[dev]'
          PYTHONPATH=windows-integrated-src python -m pytest -q windows-integrated-src/tests
      - name: Commit checked native changes to main only (fast-forward)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
            echo "main changed during work; abort without overwriting anything." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git add -A -- windows-integrated-src/ docs/automation_full_handoff.md
          if git diff --cached --name-only --diff-filter=D | grep -q .; then
            echo "Source deletion prohibited. Abort." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No existing native application code changed. No development committed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: verified AIWACK native integrated development on main"
          BASIC=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $BASIC" push origin "HEAD:refs/heads/main"
          echo "Committed reviewed native changes directly to main; no branch created." >> "$GITHUB_STEP_SUMMARY"
